name: exist-db CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exist-version: [release, latest]
        node-version: ['24']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run xar

      - name: Start eXist-db
        run: |
          docker run --rm --name exist \
            --volume $(pwd)/build:/exist/autodeploy:ro \
            --publish 8080:8080 \
            --detach existdb/existdb:${{ matrix.exist-version }}
          timeout 90 sh -c 'until nc -z localhost 8080; do sleep 3; done'

      - name: Run Cypress tests
        run: npx cypress run

      - name: Upload screenshots (on failure)
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.exist-version }}-${{ matrix.node-version }}
          path: cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cypress-videos-${{ matrix.exist-version }}-${{ matrix.node-version }}
          path: cypress/videos
